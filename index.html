<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e0f12">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Strem</title>
<style>
  :root { color-scheme: dark; --bg: #0e0f12; --panel: #17191f; --panel2: #1f2229; --text: #e8e8ea; --dim: #8b8e97; --teal: #2fb3b3; --teal-dark: #0b1414; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 17px; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 12px); max-width: 480px; margin: 0 auto; min-height: 100%; }
  .hidden { display: none !important; }
  header { display: flex; align-items: center; justify-content: space-between; height: 48px; margin-bottom: 6px; }
  .logo { width: 40px; height: 40px; }
  .links { display: flex; gap: 8px; }
  .links button { width: 52px; height: 44px; padding: 0; border-radius: 12px; background: var(--panel); display: flex; align-items: center; justify-content: center; }
  .links svg { width: 24px; height: 24px; }
  .status { font-size: 13px; color: var(--dim); text-align: center; min-height: 18px; margin: 4px 0 10px; }
  .status.on { color: #6fd3a0; }
  button { font: inherit; color: var(--text); background: var(--panel); border: 0; border-radius: 14px; padding: 0; transition: transform 70ms ease, background 70ms ease; touch-action: manipulation; }
  button:active, button.down { background: var(--teal); color: var(--teal-dark); transform: scale(0.94); }
  button svg { fill: currentColor; }
  main { flex: 1; display: flex; flex-direction: column; }
  /* remote */
  .pad { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1; margin: 6px auto 14px; display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; gap: 10px; }
  .pad button { font-size: 30px; border-radius: 20px; }
  .pad .ok { background: var(--panel2); font-size: 22px; font-weight: 700; border-radius: 50%; }
  .pad .corner { background: transparent; }
  .pad .corner.back { background: var(--panel); font-size: 15px; font-weight: 600; }
  .media { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .media button { height: 60px; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .media svg { width: 22px; height: 22px; }
  .footer { display: flex; gap: 10px; margin-top: auto; padding-top: 14px; }
  .footer button { flex: 1; height: 50px; font-size: 16px; }
  .footer button.dim { color: var(--dim); }
  /* keyboard screen */
  textarea { width: 100%; font: inherit; font-size: 18px; color: #fff; background: var(--panel); border: 2px solid var(--panel2); border-radius: 14px; padding: 14px; outline: none; height: 110px; resize: none; user-select: text; -webkit-user-select: text; }
  textarea:focus { border-color: var(--teal); }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row button { flex: 1; height: 54px; font-size: 17px; }
  .primary { background: var(--teal); color: var(--teal-dark); font-weight: 600; }
  .small { font-size: 13px; color: var(--dim); line-height: 1.45; margin-top: 14px; }
  label { display: block; font-size: 14px; color: var(--dim); margin: 6px 0 8px; }
  input.code { width: 100%; font: inherit; font-family: Menlo, Consolas, monospace; font-size: 20px; letter-spacing: 3px; text-transform: uppercase; color: #fff; background: var(--panel); border: 2px solid var(--panel2); border-radius: 14px; padding: 14px; outline: none; user-select: text; -webkit-user-select: text; }
  input.code:focus { border-color: var(--teal); }
  h2 { font-size: 18px; font-weight: 600; margin: 10px 0 6px; }
  /* camera scanner */
  #scanner { position: fixed; inset: 0; background: #000; z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #scanner .frame { position: relative; width: 66vw; max-width: 320px; aspect-ratio: 1; border: 3px solid rgba(154,208,198,0.9); border-radius: 18px; box-shadow: 0 0 0 100vmax rgba(0,0,0,0.45); }
  #scanner .scan-hint { position: absolute; top: calc(env(safe-area-inset-top) + 24px); left: 16px; right: 16px; text-align: center; color: #fff; font-size: 16px; text-shadow: 0 1px 3px #000; }
  #scanner .zoom { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 90px); left: 24px; right: 24px; display: flex; align-items: center; gap: 12px; color: #fff; font-size: 14px; }
  #scanner .zoom input { flex: 1; -webkit-appearance: none; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.4); }
  #scanner .zoom input::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; border-radius: 50%; background: #9ad0c6; }
  #scanner button { position: absolute; bottom: calc(env(safe-area-inset-bottom) + 24px); left: 50%; transform: translateX(-50%); width: 160px; height: 50px; background: rgba(23,25,31,0.9); }
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 40 40" aria-label="Strem"><rect width="40" height="40" rx="11" fill="#2fb3b3"/><path d="M15 11.5v17l14-8.5z" fill="#0b1414"/></svg>
  <div class="links">
    <button id="nav-home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M12 3.2 2.5 11.6h2.8V20h5.2v-5.5h3v5.5h5.2v-8.4h2.8z"/></svg></button>
    <button id="nav-search" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M10 3.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13zm0 2.4a4.1 4.1 0 1 0 0 8.2 4.1 4.1 0 0 0 0-8.2zm5.6 9.2 5 5-1.7 1.7-5-5z"/></svg></button>
    <button id="nav-settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8.3a3.7 3.7 0 1 1 0 7.4 3.7 3.7 0 0 1 0-7.4zm-1.9-5.1h3.8l.5 2.5 1.6.9 2.4-.9 1.9 3.3-1.9 1.6v1.8l1.9 1.6-1.9 3.3-2.4-.9-1.6.9-.5 2.5h-3.8l-.5-2.5-1.6-.9-2.4.9-1.9-3.3 1.9-1.6v-1.8L3.7 9l1.9-3.3 2.4.9 1.6-.9z"/></svg></button>
  </div>
</header>
<div id="status" class="status"></div>

<main>
  <!-- pairing -->
  <section id="pair" class="hidden">
    <h2>Link this phone to the TV</h2>
    <label>On the TV open Strem → Phone and scan the code with the camera, or type it here.</label>
    <div class="row"><button class="primary" id="scan">Scan the TV's code</button></div>
    <label style="margin-top:16px">Or type the code</label>
    <input id="code" class="code" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="10 characters">
    <div class="row"><button id="link">Link</button></div>
    <div class="small">Add this page to your home screen (Share → Add to Home Screen). As an app it keeps the link permanently; as a browser tab Safari may forget it after a week without use.</div>
  </section>

  <!-- remote -->
  <section id="remote" class="hidden">
    <div class="pad">
      <button class="corner back" data-key="461">Back</button>
      <button data-key="38">▲</button>
      <button class="corner" disabled></button>
      <button data-key="37">◀</button>
      <button class="ok" data-key="13">OK</button>
      <button data-key="39">▶</button>
      <button class="corner" disabled></button>
      <button data-key="40">▼</button>
      <button class="corner" disabled></button>
    </div>
    <div class="media">
      <button data-key="412"><svg viewBox="0 0 24 24"><path d="M11 6v12L2.5 12zm10 0v12L12.5 12z"/></svg>−60 s</button>
      <button data-key="415"><svg viewBox="0 0 24 24"><path d="M7 5v14l12-7z"/></svg>Play</button>
      <button data-key="19"><svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>Pause</button>
      <button data-key="417"><svg viewBox="0 0 24 24"><path d="M13 6v12l8.5-6zm-10 0v12l8.5-6z"/></svg>+60 s</button>
      <button data-key="406"><svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zm3 8h6v2H6zm8 0h4v2h-4zM6 9h4v2H6zm6 0h6v2h-6z"/></svg>Subs</button>
    </div>
    <div class="footer">
      <button id="to-keys">Keyboard</button>
    </div>
  </section>

  <!-- keyboard -->
  <section id="keys" class="hidden">
    <h2>Send text to the TV</h2>
    <label>It fills the selected field on the TV, or starts a search.</label>
    <textarea id="text" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="send"></textarea>
    <div class="row"><button id="clear">Clear</button><button class="primary" id="send">Send to TV</button></div>
    <div class="footer"><button id="to-remote">Remote</button><button class="dim" id="unlink">Unlink TV</button></div>
  </section>
</main>

<div id="scanner" class="hidden">
  <video id="cam" playsinline muted autoplay></video>
  <div class="frame"></div>
  <div class="scan-hint" id="scan-hint">Point at the QR code on the TV</div>
  <div class="zoom"><span>1×</span><input id="zoom" type="range" min="1" max="4" step="0.1" value="1"><span>4×</span></div>
  <button id="scan-close">Cancel</button>
</div>

<script src="jsqr.js"></script>
<script>
// Shared with the phone page (same code, kept byte-identical in phone/index.html).
// Messages through the relay are RC4-encrypted with key = secret + per-message nonce, then base64.
// The secret only exists on the TV screen (QR / code) and in the phone's storage.
var Crypto = (function () {
  function rc4(key, data) {
    var S = [], i, j = 0, t, out = [];
    for (i = 0; i < 256; i++) S[i] = i;
    for (i = 0; i < 256; i++) { j = (j + S[i] + key.charCodeAt(i % key.length)) & 255; t = S[i]; S[i] = S[j]; S[j] = t; }
    // drop the first 1024 bytes of keystream (RC4-drop)
    i = 0; j = 0; var k;
    for (k = 0; k < 1024 + data.length; k++) {
      i = (i + 1) & 255; j = (j + S[i]) & 255; t = S[i]; S[i] = S[j]; S[j] = t;
      if (k >= 1024) out.push(data[k - 1024] ^ S[(S[i] + S[j]) & 255]);
    }
    return out;
  }
  function utf8Bytes(str) { var s = unescape(encodeURIComponent(str)), b = []; for (var i = 0; i < s.length; i++) b.push(s.charCodeAt(i)); return b; }
  function bytesUtf8(b) { var s = ''; for (var i = 0; i < b.length; i++) s += String.fromCharCode(b[i]); try { return decodeURIComponent(escape(s)); } catch (e) { return s; } }
  function b64(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }
  function unb64(str) { var s = atob(str), b = []; for (var i = 0; i < s.length; i++) b.push(s.charCodeAt(i)); return b; }
  var ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  function randomCode(n) { var s = ''; for (var i = 0; i < n; i++) s += ALPHA.charAt(Math.floor(Math.random() * ALPHA.length)); return s; }
  // FNV-1a over the secret, twice with different seeds: the relay topic name
  function imul(a, b) { var ah = (a >>> 16) & 0xffff, al = a & 0xffff, bh = (b >>> 16) & 0xffff, bl = b & 0xffff; return (al * bl + (((ah * bl + al * bh) << 16) >>> 0)) | 0; }
  function fnv(str, seed) { var h = seed >>> 0; for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = imul(h, 16777619) >>> 0; } return ('00000000' + h.toString(16)).slice(-8); }
  function topicFor(secret) { return 'strem-' + fnv(secret, 2166136261) + fnv(secret + '|tv', 0x9747b28c); }
  function encrypt(secret, obj) { var nonce = randomCode(8); return nonce + '.' + b64(rc4(secret + nonce, utf8Bytes(JSON.stringify(obj)))); }
  function decrypt(secret, text) {
    var i = text.indexOf('.'); if (i !== 8) return null;
    try { return JSON.parse(bytesUtf8(rc4(secret + text.slice(0, 8), unb64(text.slice(9))))); } catch (e) { return null; }
  }
  return { randomCode: randomCode, topicFor: topicFor, encrypt: encrypt, decrypt: decrypt };
})();

(function () {
  var NTFY = 'https://ntfy.sh/';
  var $ = function (id) { return document.getElementById(id); };
  var secret = null, topic = null, es = null, lastHello = 0, screen = 'remote';

  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms || 12); } catch (e) {} }
  function status(t, on) { $('status').textContent = t; $('status').className = 'status' + (on ? ' on' : ''); }
  function show(name) {
    ['pair', 'remote', 'keys'].forEach(function (id) { $(id).className = id === name ? '' : 'hidden'; });
    if (name !== 'pair') screen = name;
    if (name === 'keys') setTimeout(function () { $('text').focus(); }, 50);
  }

  // ---- link ----
  function load() {
    var fromHash = (location.hash || '').replace(/^#/, '').trim().toUpperCase();
    if (/^[A-Z2-9]{10}$/.test(fromHash)) { save(fromHash); try { history.replaceState(null, '', location.pathname); } catch (e) {} }
    try { secret = localStorage.getItem('stremSecret'); } catch (e) {}
    if (secret) start(); else { show('pair'); status('Not linked'); }
  }
  function save(s) { secret = s; try { localStorage.setItem('stremSecret', s); } catch (e) {} }
  function start() { topic = Crypto.topicFor(secret); show(screen); status('Linked · waiting for the TV…'); listen(); ping(); }
  function listen() {
    if (es) { try { es.close(); } catch (e) {} }
    try {
      es = new EventSource(NTFY + topic + '-tv/sse');
      es.onmessage = function (e) {
        var m; try { m = JSON.parse(e.data); } catch (err) { return; }
        if (m.event !== 'message') return;
        var d = Crypto.decrypt(secret, m.message || '');
        if (d && d.t === 'hello') { lastHello = +new Date(); status('TV linked', true); }
      };
      es.onerror = function () { setTimeout(listen, 5000); };
    } catch (e) {}
  }
  setInterval(function () {
    if (!secret || document.hidden) return;
    if (!lastHello || (+new Date()) - lastHello > 45000) { ping(); }
    if (lastHello && (+new Date()) - lastHello > 180000) status('Linked · TV not answering (is Strem open?)');
  }, 20000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && secret) { listen(); ping(); } });

  function publish(obj, cb) {
    fetch(NTFY + topic, { method: 'POST', body: Crypto.encrypt(secret, obj) })
      .then(function (r) { if (cb) cb(r.ok ? null : new Error('relay ' + r.status)); })
      .catch(function (e) { if (cb) cb(e); });
  }
  function ping() { publish({ t: 'ping' }); }

  // ---- buttons ----
  function press(el, fn) {
    el.addEventListener('touchstart', function () { el.className += ' down'; buzz(); }, { passive: true });
    el.addEventListener('touchend', function () { el.className = el.className.replace(/\s*\bdown\b/g, ''); }, { passive: true });
    el.addEventListener('touchcancel', function () { el.className = el.className.replace(/\s*\bdown\b/g, ''); }, { passive: true });
    el.addEventListener('click', function (e) { e.preventDefault(); fn(); });
  }
  var keys = document.querySelectorAll('button[data-key]');
  for (var i = 0; i < keys.length; i++) (function (b) { press(b, function () { publish({ t: 'key', v: parseInt(b.getAttribute('data-key'), 10) }); }); })(keys[i]);
  press($('nav-home'), function () { publish({ t: 'nav', v: 'home' }); });
  press($('nav-search'), function () { publish({ t: 'nav', v: 'search' }); show('keys'); });
  press($('nav-settings'), function () { publish({ t: 'nav', v: 'settings' }); });
  press($('to-keys'), function () { show('keys'); });
  press($('to-remote'), function () { show('remote'); });
  press($('clear'), function () { $('text').value = ''; $('text').focus(); });
  press($('send'), function () {
    var t = $('text').value.trim(); if (!t) return;
    $('send').disabled = true;
    publish({ t: 'text', v: t }, function (err) {
      $('send').disabled = false;
      if (err) { status('Could not reach the relay: ' + err.message); return; }
      $('text').value = ''; status('Sent: ' + t, true); buzz(25);
    });
  });
  $('text').addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click(); } });
  press($('link'), function () {
    var c = $('code').value.trim().toUpperCase();
    if (!/^[A-Z2-9]{10}$/.test(c)) { status('The code is 10 letters/digits'); return; }
    save(c); start();
  });
  press($('unlink'), function () { try { localStorage.removeItem('stremSecret'); } catch (e) {} secret = null; if (es) es.close(); show('pair'); status('Not linked'); });

  // ---- QR scanner (camera + jsQR; BarcodeDetector when the browser has it) ----
  var stream = null, scanTimer = null;
  function codeFrom(text) { var m = /([A-Z2-9]{10})\s*$/.exec(String(text || '').trim().toUpperCase()); return m ? m[1] : null; }
  function stopScan() { clearTimeout(scanTimer); scanTimer = null; if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; } $('scanner').className = 'hidden'; $('cam').style.transform = ''; }
  function startScan() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { status('This browser cannot use the camera here; type the code instead.'); return; }
    $('scanner').className = ''; $('scan-hint').textContent = 'Point at the QR code on the TV';
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }).then(function (s) {
      stream = s; var v = $('cam'); v.srcObject = s; v.play().catch(function () {});
      var canvas = document.createElement('canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
      // zoom: the camera's own zoom when the phone offers it, otherwise a digital crop of the frame
      var track = s.getVideoTracks()[0], caps = {}; try { caps = track.getCapabilities ? track.getCapabilities() : {}; } catch (e) {}
      var zoom = 1, optical = !!(caps.zoom && caps.zoom.max > 1);
      var slider = $('zoom'); slider.value = 1; v.style.transform = '';
      slider.oninput = function () {
        zoom = parseFloat(slider.value);
        if (optical) { var z = Math.min(caps.zoom.max, Math.max(caps.zoom.min || 1, zoom)); track.applyConstraints({ advanced: [{ zoom: z }] }).catch(function () { optical = false; v.style.transform = 'scale(' + zoom + ')'; }); }
        else v.style.transform = 'scale(' + zoom + ')';
      };
      var detector = null; try { if (window.BarcodeDetector) detector = new BarcodeDetector({ formats: ['qr_code'] }); } catch (e) {}
      function found(text) { var c = codeFrom(text); if (!c) { $('scan-hint').textContent = 'That is not a Strem code'; return false; } stopScan(); save(c); buzz(30); start(); return true; }
      function tick() {
        if (!stream) return;
        if (v.readyState >= 2 && v.videoWidth) {
          if (detector) {
            detector.detect(v).then(function (codes) { if (codes.length && found(codes[0].rawValue)) return; scanTimer = setTimeout(tick, 150); }).catch(function () { detector = null; scanTimer = setTimeout(tick, 150); });
            return;
          }
          var w = 480, h = Math.round(v.videoHeight / v.videoWidth * w); canvas.width = w; canvas.height = h;
          var dz = optical ? 1 : zoom, sw = v.videoWidth / dz, sh = v.videoHeight / dz;
          ctx.drawImage(v, (v.videoWidth - sw) / 2, (v.videoHeight - sh) / 2, sw, sh, 0, 0, w, h);
          var img = ctx.getImageData(0, 0, w, h);
          var r = window.jsQR ? jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' }) : null;
          if (r && r.data && found(r.data)) return;
        }
        scanTimer = setTimeout(tick, 120);
      }
      tick();
    }).catch(function (e) { stopScan(); status('Camera not available: ' + (e && e.name === 'NotAllowedError' ? 'permission denied' : (e && e.message || e))); });
  }
  press($('scan'), startScan);
  press($('scan-close'), stopScan);

  window.addEventListener('hashchange', load);
  if ('serviceWorker' in navigator) { try { navigator.serviceWorker.register('sw.js'); } catch (e) {} }
  load();
})();
</script>
</body>
</html>
